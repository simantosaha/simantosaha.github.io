<script>


/* =========================================================
   CONFIGURATION
   ========================================================= */

const BIB_FILE = "publications.bib";

const YOUR_LAST_NAME = "Saha";

const YOUR_FIRST_NAME = "Simanto";



/* =========================================================
   LOAD BIBTEX
   ========================================================= */

fetch(BIB_FILE)

.then(response => {

    if (!response.ok) {

        throw new Error(
            "Could not find publications.bib"
        );

    }

    return response.text();

})

.then(text => {

    const publications =
        parseBibTeX(text);

    displayPublications(
        publications
    );

    document.getElementById(
        "loading"
    ).style.display = "none";

})

.catch(error => {

    document.getElementById(
        "loading"
    ).style.display = "none";

    const errorBox =
        document.getElementById("error");

    errorBox.style.display = "block";

    errorBox.innerHTML =
        "<strong>Unable to load publications.</strong><br><br>" +
        escapeHTML(error.message) +
        "<br><br>" +
        "Make sure that <strong>publications.bib</strong> " +
        "is in the same folder as " +
        "<strong>publications.html</strong>.";

});



/* =========================================================
   ROBUST BIBTEX PARSER
   ========================================================= */

/*
 * This parser deliberately does NOT use the previous
 * regular expression that caused:
 *
 * r = 2019
 * e = ...
 *
 * errors.
 *
 * It reads each BibTeX entry and tracks braces correctly.
 */

function parseBibTeX(text) {

    const publications = [];

    let position = 0;

    while (position < text.length) {

        const at =
            text.indexOf("@", position);

        if (at === -1) {
            break;
        }

        const typeMatch =
            text.slice(at).match(
                /^@([A-Za-z]+)\s*\{/
            );

        if (!typeMatch) {

            position =
                at + 1;

            continue;
        }

        const type =
            typeMatch[1].toLowerCase();

        const entryStart =
            at + typeMatch[0].length;

        /*
         * Find the matching closing brace.
         */

        let depth = 1;

        let i = entryStart;

        let inQuotes = false;

        while (
            i < text.length &&
            depth > 0
        ) {

            const char =
                text[i];

            if (char === '"' &&
                text[i - 1] !== "\\") {

                inQuotes =
                    !inQuotes;
            }

            if (!inQuotes) {

                if (char === "{") {
                    depth++;
                }

                else if (char === "}") {
                    depth--;
                }

            }

            i++;
        }

        if (depth !== 0) {
            break;
        }

        const content =
            text.slice(
                entryStart,
                i - 1
            );

        const comma =
            findTopLevelComma(
                content
            );

        if (comma === -1) {

            position = i;

            continue;
        }

        const key =
            content
                .slice(0, comma)
                .trim();

        const body =
            content
                .slice(comma + 1);

        const fields =
            parseFieldsSafely(
                body
            );

        publications.push({

            type,

            key,

            ...fields

        });

        position = i;
    }

    return publications;
}



/* =========================================================
   FIND TOP LEVEL COMMA
   ========================================================= */

function findTopLevelComma(text) {

    let depth = 0;

    let inQuotes = false;

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        if (
            char === '"' &&
            text[i - 1] !== "\\"
        ) {

            inQuotes =
                !inQuotes;

            continue;
        }

        if (inQuotes) {
            continue;
        }

        if (char === "{") {
            depth++;
        }

        else if (char === "}") {
            depth--;
        }

        else if (
            char === "," &&
            depth === 0
        ) {

            return i;

        }

    }

    return -1;
}



/* =========================================================
   PARSE FIELDS SAFELY
   ========================================================= */

function parseFieldsSafely(body) {

    const fields = {};

    let i = 0;

    while (i < body.length) {

        /*
         * Skip whitespace and commas.
         */

        while (
            i < body.length &&
            (
                /\s/.test(body[i]) ||
                body[i] === ","
            )
        ) {

            i++;
        }

        if (i >= body.length) {
            break;
        }

        /*
         * Read field name.
         */

        const nameStart = i;

        while (
            i < body.length &&
            /[A-Za-z0-9_-]/.test(body[i])
        ) {

            i++;
        }

        const fieldName =
            body
                .slice(
                    nameStart,
                    i
                )
                .toLowerCase();

        /*
         * Skip whitespace.
         */

        while (
            i < body.length &&
            /\s/.test(body[i])
        ) {

            i++;
        }

        /*
         * Expect equals sign.
         */

        if (
            body[i] !== "="
        ) {

            /*
             * Skip malformed text
             * instead of interpreting it
             * as a field.
             */

            while (
                i < body.length &&
                body[i] !== ","
            ) {

                i++;
            }

            continue;
        }

        i++;

        /*
         * Skip whitespace.
         */

        while (
            i < body.length &&
            /\s/.test(body[i])
        ) {

            i++;
        }

        /*
         * Read value.
         */

        let value = "";

        if (
            body[i] === "{"
        ) {

            const start = i;

            let depth = 0;

            let inQuotes = false;

            while (
                i < body.length
            ) {

                const char =
                    body[i];

                if (
                    char === '"' &&
                    body[i - 1] !== "\\"
                ) {

                    inQuotes =
                        !inQuotes;
                }

                if (!inQuotes) {

                    if (char === "{") {
                        depth++;
                    }

                    else if (
                        char === "}"
                    ) {

                        depth--;

                        if (
                            depth === 0
                        ) {

                            i++;

                            break;
                        }
                    }
                }

                i++;
            }

            value =
                body.slice(
                    start,
                    i
                );

        }

        else if (
            body[i] === '"'
        ) {

            i++;

            while (
                i < body.length
            ) {

                const char =
                    body[i];

                if (
                    char === '"' &&
                    body[i - 1] !== "\\"
                ) {

                    i++;

                    break;
                }

                value += char;

                i++;
            }

        }

        else {

            const start = i;

            while (
                i < body.length &&
                body[i] !== ","
            ) {

                i++;
            }

            value =
                body.slice(
                    start,
                    i
                );

        }

        fields[fieldName] =
            cleanBibValue(value);

    }

    return fields;
}



/* =========================================================
   CLEAN BIBTEX VALUE
   ========================================================= */

function cleanBibValue(value) {

    value =
        value.trim();

    /*
     * Remove outer braces only.
     */

    if (
        value.startsWith("{") &&
        value.endsWith("}")
    ) {

        value =
            value.slice(
                1,
                -1
            );

    }

    /*
     * Remove outer quotes.
     */

    if (
        value.startsWith('"') &&
        value.endsWith('"')
    ) {

        value =
            value.slice(
                1,
                -1
            );

    }

    /*
     * Preserve useful braces
     * for capitalization but remove
     * unnecessary ones.
     */

    value =
        value.replace(
            /\\&/g,
            "&"
        );

    value =
        value.replace(
            /\\%/g,
            "%"
        );

    value =
        value.replace(
            /\\_/g,
            "_"
        );

    value =
        value.replace(
            /\\-/g,
            "-"
        );

    value =
        value.replace(
            /--/g,
            "–"
        );

    value =
        value.replace(
            /~/g,
            " "
        );

    /*
     * Remove remaining BibTeX braces.
     */

    value =
        value.replace(
            /[{}]/g,
            ""
        );

    /*
     * Normalize whitespace.
     */

    value =
        value.replace(
            /\s+/g,
            " "
        );

    return value.trim();
}



/* =========================================================
   DISPLAY
   ========================================================= */

function displayPublications(
    publications
) {

    publications.sort(
        (a, b) => {

            const yearA =
                parseInt(a.year) || 0;

            const yearB =
                parseInt(b.year) || 0;

            if (
                yearA !== yearB
            ) {

                return (
                    yearB - yearA
                );

            }

            return (
                (a.title || "")
                .localeCompare(
                    b.title || ""
                )
            );

        }
    );

    renderPublications(
        publications
    );
}



/* =========================================================
   RENDER
   ========================================================= */

function renderPublications(
    publications
) {

    const container =
        document.getElementById(
            "publications"
        );

    container.innerHTML = "";

    if (
        publications.length === 0
    ) {

        container.innerHTML =
            '<div class="empty-message">' +
            'No publications listed.' +
            '</div>';

        return;
    }

    publications.forEach(
        publication => {

            const item =
                document.createElement(
                    "article"
                );

            item.className =
                "publication";

            /*
             * YEAR + TYPE
             */

            const marker =
                document.createElement(
                    "div"
                );

            marker.className =
                "publication-marker";

            const year =
                document.createElement(
                    "div"
                );

            year.className =
                "publication-year";

            year.textContent =
                publication.year || "";

            const type =
                document.createElement(
                    "div"
                );

            type.className =
                "publication-type";

            type.textContent =
                getPublicationType(
                    publication
                );

            marker.appendChild(year);

            marker.appendChild(type);


            /*
             * CITATION
             */

            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "publication-text";

            text.innerHTML =
                formatIEEE(
                    publication
                );


            item.appendChild(marker);

            item.appendChild(text);

            container.appendChild(item);

        }
    );
}



/* =========================================================
   PUBLICATION TYPE
   ========================================================= */

function getPublicationType(
    publication
) {

    if (
        publication.type === "article"
    ) {

        return "Journal Article";

    }

    if (
        publication.type === "inproceedings" ||
        publication.type === "conference"
    ) {

        return "Conference Paper";

    }

    return "Publication";
}



/* =========================================================
   IEEE FORMAT
   ========================================================= */

function formatIEEE(
    publication
) {

    let citation = "";


    /*
     * AUTHORS
     */

    if (
        publication.author
    ) {

        citation +=
            formatAuthors(
                publication.author
            );

        citation += ", ";

    }


    /*
     * TITLE
     */

    if (
        publication.title
    ) {

        citation +=
            "“" +
            escapeHTML(
                publication.title
            ) +
            ",” ";

    }


    /*
     * JOURNAL
     */

    if (
        publication.type === "article"
    ) {

        if (
            publication.journal
        ) {

            citation +=
                '<span class="citation-journal">' +
                escapeHTML(
                    publication.journal
                ) +
                "</span>";

        }

        if (
            publication.volume
        ) {

            citation +=
                ", vol. " +
                escapeHTML(
                    publication.volume
                );

        }

        if (
            publication.number
        ) {

            citation +=
                ", no. " +
                escapeHTML(
                    publication.number
                );

        }

        if (
            publication.pages
        ) {

            citation +=
                ", pp. " +
                escapeHTML(
                    publication.pages
                );

        }

    }


    /*
     * CONFERENCE
     */

    else {

        if (
            publication.booktitle
        ) {

            citation +=
                "in " +
                '<span class="citation-conference">' +
                escapeHTML(
                    publication.booktitle
                ) +
                "</span>";

        }

        if (
            publication.volume
        ) {

            citation +=
                ", vol. " +
                escapeHTML(
                    publication.volume
                );

        }

        if (
            publication.pages
        ) {

            citation +=
                ", pp. " +
                escapeHTML(
                    publication.pages
                );

        }

    }


    /*
     * YEAR
     *
     * Year is already displayed in the
     * left-hand marker, so do not repeat it.
     */

    citation += ".";


    /*
     * DOI
     *
     * The DOI itself is clickable.
     * No additional [DOI] link.
     */

    if (
        publication.doi
    ) {

        let doi =
            publication.doi.trim();

        doi =
            doi.replace(
                /^https?:\/\/(dx\.)?doi\.org\//i,
                ""
            );

        doi =
            doi.replace(
                /^doi:\s*/i,
                ""
            );

        citation +=
            ' <a class="doi-link" ' +
            'href="https://doi.org/' +
            encodeURI(doi) +
            '" target="_blank" ' +
            'rel="noopener noreferrer">' +
            'doi:' +
            escapeHTML(doi) +
            '</a>.';

    }


    return citation;
}



/* =========================================================
   AUTHOR FORMATTING
   ========================================================= */

function formatAuthors(
    authorString
) {

    /*
     * BibTeX separates authors with "and".
     */

    const authors =
        splitAuthors(
            authorString
        );


    const formatted =
        authors.map(
            author => {

                const name =
                    formatAuthorName(
                        author
                    );

                if (
                    isYourName(
                        author
                    )
                ) {

                    return (
                        '<span class="my-name">' +
                        escapeHTML(name) +
                        '</span>'
                    );

                }

                return escapeHTML(name);

            }
        );


    /*
     * IEEE:
     *
     * A. Author, B. Author, and C. Author
     */

    if (
        formatted.length === 1
    ) {

        return formatted[0];

    }

    if (
        formatted.length === 2
    ) {

        return (
            formatted[0] +
            " and " +
            formatted[1]
        );

    }

    return (
        formatted
            .slice(0, -1)
            .join(", ") +
        ", and " +
        formatted[
            formatted.length - 1
        ]
    );
}



/* =========================================================
   SPLIT AUTHORS
   ========================================================= */

function splitAuthors(
    authorString
) {

    /*
     * Since your BibTeX uses "and" between authors,
     * this is safe and preserves names such as
     * "Alam, Raquib-ul".
     */

    return authorString
        .split(/\s+and\s+/i)
        .map(
            author =>
                author.trim()
        )
        .filter(
            author =>
                author.length > 0
        );

}



/* =========================================================
   AUTHOR NAME
   ========================================================= */

function formatAuthorName(
    author
) {

    author =
        author
            .replace(
                /[{}]/g,
                ""
            )
            .trim();


    /*
     * BibTeX format:
     *
     * Saha, Simanto
     */

    if (
        author.includes(",")
    ) {

        const comma =
            author.indexOf(",");

        const lastName =
            author
                .slice(
                    0,
                    comma
                )
                .trim();

        const firstName =
            author
                .slice(
                    comma + 1
                )
                .trim();

        return (
            formatInitials(
                firstName
            ) +
            " " +
            lastName
        );

    }


    /*
     * Fallback:
     *
     * Simanto Saha
     */

    const parts =
        author
            .split(/\s+/)
            .filter(Boolean);

    if (
        parts.length === 1
    ) {

        return parts[0];

    }

    const lastName =
        parts.pop();

    return (
        formatInitials(
            parts.join(" ")
        ) +
        " " +
        lastName
    );
}



/* =========================================================
   INITIALS
   ========================================================= */

function formatInitials(
    name
) {

    /*
     * Handles:
     *
     * Simanto
     * Khawza Iftekhar Uddin
     * Raquib-ul
     * Michael Loong-Siong
     */

    const words =
        name
            .replace(
                /[{}]/g,
                ""
            )
            .split(/\s+/)
            .filter(Boolean);


    const initials = [];


    words.forEach(
        word => {

            /*
             * Remove LaTeX commands.
             */

            word =
                word.replace(
                    /\\[a-zA-Z]+/g,
                    ""
                );


            /*
             * Ignore punctuation around
             * the word.
             */

            word =
                word.replace(
                    /^[^A-Za-zÀ-ÿ]+|[^A-Za-zÀ-ÿ-]+$/g,
                    ""
                );


            if (!word) {
                return;
            }


            /*
             * IEEE initials.
             *
             * For a hyphenated given name:
             *
             * Loong-Siong
             *
             * → L.-S.
             */

            if (
                word.includes("-")
            ) {

                const pieces =
                    word
                        .split("-")
                        .filter(Boolean);

                if (
                    pieces.length > 1
                ) {

                    initials.push(
                        pieces
                            .map(
                                piece =>
                                    piece
                                        .charAt(0)
                                        .toUpperCase() +
                                    "."
                            )
                            .join("-")
                    );

                }

                else {

                    initials.push(
                        word
                            .charAt(0)
                            .toUpperCase() +
                        "."
                    );

                }

            }

            else {

                initials.push(
                    word
                        .charAt(0)
                        .toUpperCase() +
                    "."
                );

            }

        }
    );


    return initials.join(" ");
}



/* =========================================================
   IDENTIFY YOUR NAME
   ========================================================= */

function isYourName(
    author
) {

    const normalized =
        author
            .replace(
                /[{}]/g,
                ""
            )
            .toLowerCase()
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    return (
        normalized ===
        "saha, simanto"
    );

}



/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}
